[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["v2a_inspect"]
module-root = "src"

[tool.uv-build]
include = [
    "src/v2a_inspect/prompts/files/**/*.txt",
    "src/v2a_inspect/ui/*.html",
]

[project]
name = "v2a-inspect"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.2.12",
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=1.1.14",
    "langgraph>=1.1.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "httpx>=0.27.0",
    "scenedetect>=0.7",
    "av>=17.0.1",
    "pillow>=11.3.0",
    "pycocotools>=2.0.11",
    "typer>=0.20.0",
]

[project.optional-dependencies]
observability = [
    "langfuse>=3.9.0",
]
ui = [
    "fastapi>=0.136.1",
    "python-multipart>=0.0.28",
    "uvicorn[standard]>=0.46.0",
]

[project.scripts]
v2a-inspect = "v2a_inspect.cli:main"
v2a-inspect-ui = "v2a_inspect.ui.cli:main"

[dependency-groups]
dev = [
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "pre-commit>=4.5.1",
    "ruff>=0.15.6",
    "ty>=0.0.26",
]
