[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["v2a_inspect_server"]
module-root = "src"

[project]
name = "v2a-inspect-server"
version = "0.1.0"
description = "Remote/server-side tooling for the v2a_inspect visual pipeline"
readme = "README.md"
requires-python = ">=3.11,<=3.14"
dependencies = [
  "flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.4/flash_attn-2.6.3+cu128torch2.11-cp310-cp310-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl ; python_version == '3.10'",
  "flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.4/flash_attn-2.6.3+cu128torch2.11-cp311-cp311-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl ; python_version == '3.11'",
  "flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.4/flash_attn-2.6.3+cu128torch2.11-cp312-cp312-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl ; python_version == '3.12'",
  "flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.4/flash_attn-2.6.3+cu128torch2.11-cp313-cp313-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl ; python_version == '3.13'",
  "torchvision==0.26",
  "torch==2.11.0",
  "pydantic>=2.12.5",
  "pydantic-settings>=2.13.1",
  "fastapi>=0.136.1",
  "uvicorn[standard]>=0.46.0",
  "opencv-python-headless>=4.11,<4.12",
  "transformers>=5.8.1",
  "python-multipart>=0.0.28",
  "pycocotools>=2.0.11",
  "psutil>=7.2.2",
  "flash-attn-3",
]

[project.scripts]
v2a-inspect-server = "v2a_inspect_server.runtime:main"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
flash-attn-3 = { url = "https://github.com/windreamer/flash-attention3-wheels/releases/download/2026.05.11-5e0e3b1/flash_attn_3-3.0.0+20260511.cu128torch2110cxx11abitrue.ab6632-cp39-abi3-linux_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
