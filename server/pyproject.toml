[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["v2a_inspect_server"]
module-root = "src"

[project]
name = "v2a-inspect-server"
version = "0.1.0"
description = "Remote/server-side tooling for the v2a_inspect visual pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.12.5",
  "pydantic-settings>=2.7.0",
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.1",
  "python-multipart>=0.0.9",
]

[project.scripts]
v2a-inspect-server = "v2a_inspect_server.runtime:main"


